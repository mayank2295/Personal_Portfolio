<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mayank Gupta monogram">
  <defs>
    <radialGradient id="bg" cx="78%" cy="14%" r="95%">
      <stop offset="0%" stop-color="#4a1709"/>
      <stop offset="52%" stop-color="#120b0b"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </radialGradient>
    <linearGradient id="m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a52"/>
      <stop offset="55%" stop-color="#ff4d2e"/>
      <stop offset="100%" stop-color="#f02e12"/>
    </linearGradient>
  </defs>

  <!-- Tile with warm corner glow (echoes the site's light system) -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="21.5" fill="none" stroke="#ff4d2e" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Monogram M (geometric, crisp at any size) -->
  <path d="M25 73 V31 L50 60 L75 31 V73"
        fill="none" stroke="url(#m)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent 'available' dot -->
  <circle cx="50" cy="50.5" r="4.6" fill="#ff4d2e"/>
</svg>
